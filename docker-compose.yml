services:
  api:
      build:
        context: .
        dockerfile: docker/Dockerfile

      ports:
        - "8000:8000"

      env_file:
        - .env

      command:
        - uv
        - run
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"

      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

  redis:
    image: redis:7.2.4
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data: